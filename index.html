<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced To-Do List</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
  

    <div class="app-container">
        
        <header class="header">
            <div class="header-content">
                <p class="greeting" id="greetingText"></p>
                <h1 id="mainTitle"><span id="username" title="Click to edit name">Your</span> To-Do List</h1>
            </div>
            <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0id2hpdGUiIHdpZHRoPSI0OHB4IiBoZWlnaHQ9IjQ4cHgiPjxwYXRoIGQ9Ik0wIDBoMjR2MjRIMHoiIGZpbGw9Im5vbmUiLz48cGF0aCBkPSJNMTkgM0g1Yy0xLjEgMC0yIC45LTIgMnYxNGMwIDEuMS45IDIgMiAyaDE0YzEuMSAwIDItLjkgMi0yVjVjMC0xLjEtLjktMi0yLTJ6bTAgMTZINVY1aDE0djE0eiIvPjxwYXRoIGQ9Ik0xOCAxN2gtOHYtMmg4djJ6bTAtNGgtOHYtMmg4djJ6bS0yLDRoLTR2LTJoNHYyek03IDdoMnYySDd6bTAgNGgydjJIN3ptMCA0aDJ2Mkg3eiIvPjwvc3ZnPg==" alt="icon">
        </header>

        <p class="quote" id="quoteDisplay"></p>

        <form class="add-task-form" id="addTaskForm">
            <input type="text" id="taskInput" placeholder="Add a new task..." required>
            <input type="date" id="taskDateInput">
            <button type="submit">Add</button>
        </form>

        <ul class="task-list" id="taskList">
            </ul>

        <footer class="footer" id="footer">
            <span id="taskCount">0 tasks left</span>
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
            <button class="clear-btn" id="clearCompletedBtn">Clear Completed</button>
        </footer>
    </div>

    <script src="script.js" defer></script>

</body>
</html>
